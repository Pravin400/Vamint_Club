# Database Configuration (MySQL - environment variable driven)
# Recommended: set the following env vars in production or your hosting platform:
# JDBC_DATABASE_URL, JDBC_DATABASE_USERNAME, JDBC_DATABASE_PASSWORD
# Example JDBC URL: jdbc:mysql://sql5.freesqldatabase.com:3306/sql5825040?useSSL=false&serverTimezone=UTC
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:mysql://sql5.freesqldatabase.com:3306/sql5825040?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${JDBC_DATABASE_USERNAME:sql5825040}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:rJzqP3a6Ip}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Free SQL Database connection limit fix
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Hibernate auto-detects the dialect from the connected MySQL driver (no need to specify)
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=true

# Server Configuration
server.port=8080

# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:5173
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

